{{- if .Values.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osService.fullname" . }}-secret
  labels:
    {{- include "osService.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
